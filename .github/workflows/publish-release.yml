name: publish-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os, runpy
          version = runpy.run_path('src/ntfsfind/__about__.py')['__version__']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag does not match package version')
          PYTHON
  tests:
    needs: version
    uses: ./.github/workflows/test.yaml
  binaries:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            extension: .exe
          - os: ubuntu-24.04
            platform: linux
            extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked
      - name: Build standalone binary
        run: uv run --locked python -m nuitka --standalone --onefile --follow-imports --include-distribution-metadata=ntfsfind -o ntfsfind${{ matrix.extension }} --output-dir=dist --assume-yes-for-downloads src/ntfsfind/cli.py
      - name: Verify binary
        shell: bash
        run: |
          dist/ntfsfind${{ matrix.extension }} --help
          dist/ntfsfind${{ matrix.extension }} --version
      - name: Collect exact dependency license notices
        run: uv run --locked python .github/scripts/collect_licenses.py ntfsfind dist/third-party-licenses
      - name: Package binary and notices
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/stage
          cp dist/ntfsfind${{ matrix.extension }} dist/stage/
          cp -r dist/third-party-licenses dist/stage/
          cd dist/stage
          python -m zipfile -c ../ntfsfind-${{ matrix.platform }}-x64-$RELEASE_TAG.zip ntfsfind${{ matrix.extension }} third-party-licenses/
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: dist/ntfsfind-${{ matrix.platform }}-x64-*.zip
          if-no-files-found: error
  package:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - name: Check lockfile and build package
        run: |
          uv lock --check
          uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [binaries, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - run: python -m pip install uv==0.12.23
      - name: Publish Python package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/
      - name: Publish complete binary release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: binaries/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
