[project]
name = "ntfsfind"
dynamic = ["version"]
description = "A command-line tool for efficiently searching files, directories, and alternate data streams directly from NTFS image files."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sumeshi", email = "sum3sh1@protonmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "ntfsdump==3.3.5",
    "mft==0.10.0",
]

[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ntfsfind/__about__.py"

[project.urls]
Homepage = "https://github.com/sumeshi/ntfsfind"
Repository = "https://github.com/sumeshi/ntfsfind"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "nuitka>=4.3.3",
    "pytest>=9.2.0",
    "zstandard>=0.25.0",
]

[project.scripts]
ntfsfind = 'ntfsfind.cli:main'

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ntfsdump.*", "mft.*"]
ignore_missing_imports = true
